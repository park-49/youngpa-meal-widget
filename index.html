
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 급식</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    color: #38352f;
    background: #fffaf2;
  }
  .card {
    max-width: 420px;
    margin: auto;
    padding: 24px;
    border: 1px solid #eee1cf;
    border-radius: 20px;
    background: #fff;
  }
  .tag {
    color: #a56b3e;
    font-size: 12px;
    font-weight: bold;
  }
  h1 { font-size: 23px; margin: 12px 0 6px; }
  #date { color: #888; font-size: 13px; }
  #menu { line-height: 1.9; margin-top: 22px; }
  #calories { color: #888; font-size: 12px; margin-top: 18px; }
  #status { color: #888; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="tag">YOUNGPA HIGH SCHOOL</div>
  <h1>오늘의 급식</h1>
  <div id="date"></div>
  <div id="menu">급식 정보를 불러오는 중...</div>
  <div id="calories"></div>
  <div id="status"></div>
</div>

<script>
const SCHOOL_NAME = '영파여자고등학교';
const API = 'https://open.neis.go.kr/hub/';

const today = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Asia/Seoul',
  year: 'numeric', month: '2-digit', day: '2-digit'
}).format(new Date()).replaceAll('-', '');

document.getElementById('date').textContent =
  `${today.slice(0,4)}.${today.slice(4,6)}.${today.slice(6,8)}`;

async function getData(endpoint, params) {
  const url = new URL(API + endpoint);
  Object.entries(params).forEach(([k,v]) =>
    url.searchParams.set(k, v)
  );
  const response = await fetch(url);
  if (!response.ok) throw new Error('급식 API 요청 실패');
  return response.json();
}

async function loadMeal() {
  try {
    const schoolData = await getData('schoolInfo', {
      Type: 'json',
      pIndex: '1',
      pSize: '100',
      SCHUL_NM: SCHOOL_NAME
    });

    const schools = schoolData.schoolInfo?.[1]?.row || [];
    const school = schools.find(s => s.SCHUL_NM === SCHOOL_NAME);
    if (!school) throw new Error('학교 정보를 찾을 수 없습니다.');

    const mealData = await getData('mealServiceDietInfo', {
      Type: 'json',
      pIndex: '1',
      pSize: '10',
      ATPT_OFCDC_SC_CODE: school.ATPT_OFCDC_SC_CODE,
      SD_SCHUL_CODE: school.SD_SCHUL_CODE,
      MLSV_YMD: today,
      MMEAL_SC_CODE: '2'
    });

    const meals = mealData.mealServiceDietInfo?.[1]?.row || [];
    if (!meals.length) {
      document.getElementById('menu').textContent =
        '오늘 등록된 급식이 없습니다.';
      return;
    }

    const meal = meals[0];
    const menu = meal.DDISH_NM
      .split(/<br\s*\/?>/i)
      .map(s => s.replace(/\([^)]*\)/g, '').trim())
      .filter(Boolean);

    const list = document.createElement('ul');
    menu.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });

    const menuBox = document.getElementById('menu');
    menuBox.replaceChildren(list);
    document.getElementById('calories').textContent =
      meal.CAL_INFO || '';
    document.getElementById('status').textContent =
      '나이스 급식 정보 기준';
  } catch (error) {
    document.getElementById('menu').textContent =
      '급식 정보를 불러오지 못했습니다.';
    document.getElementById('status').textContent =
      '학교 정보와 API 연결을 확인해 주세요.';
    console.error(error);
  }
}

loadMeal();
</script>
</body>
</html>
